<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#142335"><title>鼓行小隊 Drum March</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;touch-action:manipulation}#wrap{max-width:900px;margin:auto;padding:10px}h1{font-size:20px;margin:5px 0}#info{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:12px;background:#b5e4d5;margin:8px 0}#status{text-align:center;min-height:46px;font-weight:700;font-size:18px}#beat{display:flex;gap:5px;margin:7px 0}#beat i{flex:1;height:9px;background:#354357;border-radius:8px}#beat i.on{background:#ffd66c}#controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{border:0;border-radius:14px;color:#fff;font-size:17px;font-weight:800;min-height:77px;touch-action:manipulation;user-select:none;-webkit-user-select:none}button:active{transform:scale(.95)}.pata{background:#f16d65}.pon{background:#4e9be5}.chaka{background:#e5a93e}.don{background:#8b73dc}#start{background:#28a68b;min-height:48px;width:100%;margin:8px 0}#help{font-size:13px;color:#c3d2df;line-height:1.65}#help b{color:white}#commands{font-size:12px;display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.cmd{background:#27384e;padding:5px 8px;border-radius:8px}#overlay{display:none;position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#142335ed;padding:24px;border-radius:16px;text-align:center;min-width:240px}#stage{position:relative}</style></head><body><div id="wrap"><h1>🥁 鼓行小隊 <small style="font-size:12px;font-weight:400">DRUM MARCH · 原創節奏策略試作</small></h1><div id="info"><span id="hp">小隊生命：♥♥♥♥♥♥</span><span id="enemy">敵方：守門巨獸</span><span id="combo">COMBO 0 · FEVER OFF</span></div><div id="stage"><canvas id="game" width="960" height="540"></canvas><div id="overlay"></div></div><div id="status">按「開始」啟動節拍，跟著亮點敲鼓</div><div id="beat"><i></i><i></i><i></i><i></i></div><div id="controls"><button class="pata" data-d="PATA">啪<br>PATA</button><button class="pon" data-d="PON">咚<br>PON</button><button class="chaka" data-d="CHAKA">鏘<br>CHAKA</button><button class="don" data-d="DON">噹<br>DON</button></div><button id="start">▶ 開始遊戲／重新開始</button><div id="commands"><span class="cmd">前進：PATA PATA PATA PON</span><span class="cmd">攻擊：PON PON PATA PON</span><span class="cmd">防禦：CHAKA CHAKA PATA PON</span></div><div id="help">玩法：每回合 <b>前四拍輸入指令</b>，後四拍 <b>小隊自動回應</b>。依照節拍燈亮起時按下鼓鍵；可在一拍內稍微提前或延後。連續成功 3 次進入 <b>FEVER</b>，攻擊威力提升。接近巨獸後攻擊，巨獸準備衝撞時用防禦指令。建議開啟手機聲音；Safari 首次按開始會啟動音效。</div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),hpEl=document.getElementById('hp'),enemyEl=document.getElementById('enemy'),comboEl=document.getElementById('combo'),dots=[...document.querySelectorAll('#beat i')],overlay=document.getElementById('overlay');const patterns={'PATA,PATA,PATA,PON':'march','PON,PON,PATA,PON':'attack','CHAKA,CHAKA,PATA,PON':'guard'};let audio=null,playing=false,last=0,elapsed=0,beatMs=520,beatNum=-1,inputs=[],combo=0,fever=false,teamHP=6,bossHP=100,dist=0,action='',actionUntil=0,guardUntil=0,enemyAttackAt=0,attackCount=0,particles=[],flash=0,win=false;function sound(d,quiet=false){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;let hz={PATA:170,PON:95,CHAKA:450,DON:260}[d]||330;o.type=d==='CHAKA'?'triangle':'sine';o.frequency.setValueAtTime(hz,t);o.frequency.exponentialRampToValueAtTime(hz*.45,t+.11);g.gain.setValueAtTime(quiet?.045:.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.15)}function say(s){status.textContent=s}function reset(){audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();playing=true;win=false;last=performance.now();elapsed=0;beatNum=-1;inputs=[];combo=0;fever=false;teamHP=6;bossHP=100;dist=0;action='';actionUntil=0;guardUntil=0;enemyAttackAt=0;attackCount=0;particles=[];overlay.style.display='none';say('預備！跟著節拍：一、二、三、四');updateHUD()}function updateHUD(){hpEl.textContent='小隊生命：'+'♥'.repeat(Math.max(0,teamHP))+'♡'.repeat(6-Math.max(0,teamHP));enemyEl.textContent='巨獸生命：'+Math.max(0,bossHP)+'%';comboEl.textContent='COMBO '+combo+' · FEVER '+(fever?'ON 🔥':'OFF')}function end(success){playing=false;win=success;overlay.style.display='block';overlay.innerHTML='<div style="font-size:32px">'+(success?'🏆':'💔')+'</div><h2>'+(success?'過關成功！':'小隊敗退')+'</h2><p>'+(success?'你擊敗了守門巨獸！':'再試一次，注意巨獸的蓄力提示。')+'</p><small>按下方開始可重新挑戰</small>';say(success?'勝利！':'失敗，重新挑戰吧！')}function hit(d){if(!playing)return;let phase=elapsed% (beatMs*8),slot=Math.round(phase/beatMs),delta=Math.abs(phase-slot*beatMs);if(slot>3||delta>190){say('節拍不準！請在前四拍敲鼓');return}let ix=slot; if(inputs[ix]){say('這一拍已敲過！');return}inputs[ix]=d;sound(d);say('♪ '+inputs.filter(Boolean).join(' · '));flash=1}function command(){const key=[0,1,2,3].map(i=>inputs[i]||'—').join(',');let type=patterns[key];if(!type){combo=0;fever=false;action='miss';say('指令未成立！重新抓節拍');sound('DON');updateHUD();return}combo++;fever=combo>=3;action=type;actionUntil=elapsed+beatMs*4;const labels={march:'前進！',attack:'攻擊！',guard:'防禦！'};say(labels[type]+(fever?' 🔥 FEVER！':''));if(type==='march'){dist=Math.min(100,dist+(fever?24:18))}if(type==='guard'){guardUntil=elapsed+beatMs*8}if(type==='attack'){if(dist<52){say('距離太遠！先用前進指令靠近');}else{let damage=fever?29:19;bossHP=Math.max(0,bossHP-damage);attackCount++;for(let i=0;i<18;i++)particles.push({x:770+Math.random()*80,y:240+Math.random()*150,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,life:35});if(bossHP<=0){end(true)}}}updateHUD()}function beatStart(n){let cycle=n%8,bar=Math.floor(n/8);dots.forEach((e,i)=>e.classList.toggle('on',cycle<4&&i===cycle));if(cycle===0){inputs=[];action='';say('輸入指令！ '+(enemyAttackAt&&enemyAttackAt-elapsed<beatMs*9?'⚠ 巨獸即將衝撞！':''))}if(cycle===4){command();if(!playing)return}sound(cycle<4?'CHAKA':'PATA',true);if(cycle===7&&bar>0&&dist>=36&&enemyAttackAt===0){enemyAttackAt=elapsed+beatMs*9;say('⚠ 巨獸蓄力！下回合準備防禦')}}function update(dt){if(!playing)return;elapsed+=dt;let n=Math.floor(elapsed/beatMs);while(beatNum<n){beatNum++;beatStart(beatNum);if(!playing)return}if(enemyAttackAt&&elapsed>=enemyAttackAt){let guarded=guardUntil>=elapsed;if(!guarded){teamHP-=fever?1:2;say('💥 巨獸衝撞！小隊受到傷害');flash=1}else{say('🛡 防禦成功！擋下衝撞')}enemyAttackAt=0;if(teamHP<=0)end(false);updateHUD()}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--});particles=particles.filter(p=>p.life>0);flash=Math.max(0,flash-dt/250)}function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function draw(t){let w=960,h=540;ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,fever?'#ffb47a':'#83c9d3');sky.addColorStop(1,'#f5dfaa');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);circle(790,100,54,'#ffe9a2');for(let i=0;i<7;i++){let x=(i*220-(dist*2)%220+1100)%1100-90;ctx.fillStyle='#6eacaa';ctx.beginPath();ctx.moveTo(x-150,360);ctx.lineTo(x,170+(i%3)*35);ctx.lineTo(x+170,360);ctx.fill()}ctx.fillStyle='#7fb49a';ctx.fillRect(0,350,960,190);ctx.fillStyle='#456d62';ctx.fillRect(0,430,960,110);for(let i=0;i<30;i++){let x=(i*53+dist*3)%960;ctx.fillStyle='#3b715e';ctx.fillRect(x,440+(i%4)*20,3,11)}let squadX=150+dist*3.3;let bob=playing?Math.sin(t/150)*4:0;for(let i=0;i<4;i++){let x=squadX-i*43,y=385+bob*(i%2?1:-1);ctx.strokeStyle='#202b36';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x,y+18);ctx.lineTo(x-9,y+43);ctx.moveTo(x,y+18);ctx.lineTo(x+12,y+43);ctx.stroke();circle(x,y-7,22,'#17222d');circle(x+8,y-10,6,'white');circle(x+10,y-10,2,'#1b2632');ctx.strokeStyle='#17222d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+12,y+8);ctx.lineTo(x+31,y-8);ctx.stroke();ctx.strokeStyle='#e9e5c8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+30,y-28);ctx.lineTo(x+30,y+17);ctx.stroke();if(i===0){ctx.fillStyle='#f8a84d';ctx.beginPath();ctx.moveTo(x+30,y-29);ctx.lineTo(x+59,y-16);ctx.lineTo(x+30,y-5);ctx.fill()}if(guardUntil>elapsed){ctx.strokeStyle='#8ae7fc';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,34,-1.2,1.5);ctx.stroke()}}let bx=790+Math.sin(t/300)*5;ctx.fillStyle='#2d3540';ctx.beginPath();ctx.ellipse(bx,354,77,102,0,0,Math.PI*2);ctx.fill();circle(bx-39,277,34,'#2d3540');circle(bx+38,277,34,'#2d3540');circle(bx-22,337,11,'#ffca61');circle(bx+23,337,11,'#ffca61');ctx.fillStyle='#25313b';ctx.fillRect(bx-63,418,36,36);ctx.fillRect(bx+29,418,36,36);ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText('守門巨獸',bx-49,222);ctx.fillStyle='#283544';ctx.fillRect(694,184,190,14);ctx.fillStyle='#fa665f';ctx.fillRect(697,187,184*bossHP/100,8);if(enemyAttackAt){ctx.fillStyle='#fa3e44';ctx.font='bold 30px sans-serif';ctx.fillText('⚠ 蓄力中！',720,150)}if(fever){ctx.fillStyle='#ffe18c';ctx.font='bold 46px sans-serif';ctx.fillText('FEVER!',375,105)}ctx.fillStyle='#fff9';ctx.font='bold 20px sans-serif';ctx.fillText('距離 '+Math.round(dist)+'%',35,42);for(const p of particles)circle(p.x,p.y,4,'#ffe6a0');if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.13)+')';ctx.fillRect(0,0,w,h)}if(!playing&&!win&&teamHP===6){ctx.fillStyle='#10243a99';ctx.fillRect(0,0,w,h);ctx.fillStyle='white';ctx.font='bold 38px sans-serif';ctx.textAlign='center';ctx.fillText('鼓聲響起，隊伍前進！',480,260);ctx.textAlign='left'}}function frame(t){let dt=Math.min(80,t-last||16);last=t;update(dt);draw(t);requestAnimationFrame(frame)}document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();hit(b.dataset.d)}));document.getElementById('start').addEventListener('click',reset);document.addEventListener('keydown',e=>{let map={a:'PATA',s:'PON',d:'CHAKA',f:'DON'};if(map[e.key.toLowerCase()])hit(map[e.key.toLowerCase()])});requestAnimationFrame(frame)})();
</script></body></html>
